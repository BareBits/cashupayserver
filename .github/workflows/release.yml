name: Release

# Cuts an immutable, versioned GitHub release when a v* tag is pushed.
#
# Replaces the old moving-tag "channel" release model. Each release carries
# four assets:
#   - cashupayserver-<tag>.zip          the standalone app (auto-updater downloads this)
#   - cashupayserver-windows-<tag>.zip  the Windows desktop package (portable POS)
#   - wordpress_plugin-<tag>.zip        the WordPress plugin (humans / WP install this)
#   - BUILD_INFO                        stable-named metadata the updater reads first
#
# The release version comes from the tag; scripts/verify-release-version.sh
# fails the build if the in-tree version strings disagree, so a tag can never
# ship advertising the wrong version.
#
# Channel semantics: a plain vX.Y[.Z] tag is a STABLE release (feeds the
# updater's 'main' channel via GitHub's /releases/latest). A tag with a
# prerelease suffix (v0.4-alpha, v1.0.0-rc1, ...) is published as a GitHub
# prerelease and feeds the 'testing' channel (newest release of any kind).
#
# Structure: build (ubuntu) -> windows-smoke (windows) -> publish (ubuntu).
# The Windows desktop zip is assembled on Linux (it's just file plumbing:
# official windows.php.net runtime + the app + launcher assets), then booted
# for real on a Windows runner before anything is published — a broken
# desktop package must never gate-crash a release.

on:
  push:
    tags:
      - "v*"
  # Reusable entry point. testing-release.yml calls this on every push to the
  # `testing` branch, passing a v<version>-testing.<run#> prerelease tag so a
  # testing-channel release is cut without duplicating the build/publish steps
  # and without needing a PAT to re-trigger a tag-push workflow.
  workflow_call:
    inputs:
      tag:
        description: >-
          Release tag to cut (e.g. v1.2-testing.5). Defaults to the pushed tag
          when this workflow is triggered by a tag push.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    # Effective tag: the workflow_call input (testing-release.yml passes a
    # v<version>-testing.<run#> prerelease tag) or, for a direct tag push, the
    # pushed ref. Every step below uses $TAG / env.TAG, never github.ref_name.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      make_latest: ${{ steps.classify.outputs.make_latest }}

    steps:
      - name: Use HTTPS for SSH-form submodule URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json, gmp, mbstring, sqlite3, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify in-tree version matches the tag
        run: ./scripts/verify-release-version.sh "$TAG"

      - name: Classify release (stable vs prerelease)
        id: classify
        # A plain vMAJOR.MINOR[.PATCH] tag is stable; anything with a suffix
        # (-alpha / -beta / -rc / ...) is a prerelease. Stable releases are
        # marked "latest" so the updater's 'main' channel (/releases/latest)
        # advances; prereleases must NOT be latest, or 'main' would jump to a
        # prerelease.
        run: |
          tag="$TAG"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
            echo "channel=main (stable)"    >> "$GITHUB_STEP_SUMMARY"
          else
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "channel=testing (prerelease)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build standalone zip
        env:
          COMMIT_SHA: ${{ github.sha }}
          CHANNEL: ${{ steps.classify.outputs.prerelease == 'true' && 'testing' || 'main' }}
        run: ./scripts/build-standalone.sh

      - name: Verify standalone layout
        run: |
          php scripts/verify-plugin-build.php build/cashupayserver \
            setup.php \
            admin.php \
            api.php \
            router.php \
            index.php \
            health.php \
            pay.php \
            product-image.php \
            update.php \
            recover.php \
            includes/database.php

      - name: Build WordPress plugin
        run: ./scripts/build-wordpress-plugin.sh

      - name: Verify WordPress plugin layout
        run: |
          php scripts/verify-plugin-build.php build/cashupay \
            cashupay.php \
            uninstall.php \
            bootstrap.php \
            rewrite-rules.php \
            admin-menu.php \
            cron-integration.php \
            activation.php \
            btcpay-integration.php \
            setup.php \
            admin.php \
            api.php \
            pay.php \
            includes/database.php \
            assets/img/barebits-gateway-logo.png

      - name: Build Windows desktop zip
        run: ./scripts/build-windows-desktop.sh

      - name: Verify Windows desktop layout
        run: |
          php scripts/verify-plugin-build.php build/CashuPayServer \
            CashuPayServer.bat \
            desktop-helper.php \
            cron-runner.php \
            README.txt \
            vc_redist.x64.exe \
            php/php.exe \
            php/ext/php_gmp.dll \
            php/cacert.pem \
            php/php.ini.template \
            php/render-ini.php \
            app/router.php \
            app/cron.php \
            app/includes/database.php

      - name: Version-stamp the release assets
        # Rename the fixed build outputs to version-stamped asset names. The
        # ZIP internals are untouched: cashupayserver.zip still extracts to
        # cashupayserver/ (the updater hardcodes that), wordpress_plugin.zip
        # still contains cashupay/ (the WP plugin slug), and the Windows zip
        # still extracts to CashuPayServer/.
        run: |
          tag="$TAG"
          cp build/cashupayserver.zip "build/cashupayserver-${tag}.zip"
          cp build/wordpress_plugin.zip "build/wordpress_plugin-${tag}.zip"
          cp build/cashupayserver-windows.zip "build/cashupayserver-windows-${tag}.zip"

      - name: Upload release assets for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 3
          path: |
            build/cashupayserver-${{ env.TAG }}.zip
            build/wordpress_plugin-${{ env.TAG }}.zip
            build/cashupayserver-windows-${{ env.TAG }}.zip
            build/cashupayserver/BUILD_INFO

  # Boot the Windows desktop package on real Windows before publishing:
  # extensions load (gmp does arithmetic), the launcher .bat brings the
  # server up, the helper opens the "browser" (test hook), the POS answers
  # over HTTP, and the helper shuts itself down after the server stops.
  windows-smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: build

      - name: Extract Windows package
        shell: pwsh
        run: |
          Expand-Archive "build/cashupayserver-windows-$env:TAG.zip" -DestinationPath smoke
          if (-not (Test-Path "smoke/CashuPayServer/php/php.exe")) {
            throw "package layout wrong: php/php.exe missing"
          }

      - name: Runtime smoke (ini render, extensions, gmp, cron-runner)
        shell: pwsh
        run: |
          $root = Resolve-Path "smoke/CashuPayServer"
          $php = "$root/php/php.exe"

          & $php -n "$root/php/render-ini.php"
          if ($LASTEXITCODE -ne 0) { throw "render-ini.php failed" }

          $mods = & $php -c "$root/php/php.ini" -m
          foreach ($ext in 'gmp','curl','mbstring','openssl','pdo_sqlite','sqlite3','zip','fileinfo') {
            if ($mods -notcontains $ext) { throw "extension not loaded: $ext" }
          }

          $pow = & $php -c "$root/php/php.ini" -r "echo gmp_strval(gmp_pow(2, 64));"
          if ($pow -ne '18446744073709551616') { throw "gmp arithmetic broken: got '$pow'" }

          # Fresh (unconfigured) install: the cron runner must bail politely.
          & $php -c "$root/php/php.ini" "$root/cron-runner.php"
          if ($LASTEXITCODE -ne 0) { throw "cron-runner.php failed on fresh install" }

      - name: Launcher smoke (boot, HTTP, browser hook, self-shutdown)
        shell: pwsh
        run: |
          $root = Resolve-Path "smoke/CashuPayServer"

          # Test hooks: don't open a real browser, tick fast so the helper's
          # 3-missed-ticks self-shutdown is observable within the test.
          $env:CASHUPAY_BROWSER_CMD = "cmd /c echo {url} > `"$root\browser-opened.txt`""
          $env:CASHUPAY_HELPER_TICK = '2'

          Start-Process -FilePath "$root\CashuPayServer.bat" -WindowStyle Hidden

          # Wait for the server to answer.
          $up = $false
          for ($i = 0; $i -lt 120 -and -not $up; $i++) {
            try {
              Invoke-WebRequest 'http://127.0.0.1:8737/' -MaximumRedirection 5 | Out-Null
              $up = $true
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (-not $up) { throw "server did not come up on 127.0.0.1:8737" }

          # A fresh install must serve the setup flow with a 200 somewhere
          # down the redirect chain.
          $resp = Invoke-WebRequest 'http://127.0.0.1:8737/' -MaximumRedirection 5
          if ($resp.StatusCode -ne 200) { throw "unexpected HTTP status $($resp.StatusCode)" }

          # The helper must have fired the browser hook.
          for ($i = 0; $i -lt 40 -and -not (Test-Path "$root\browser-opened.txt"); $i++) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path "$root\browser-opened.txt")) { throw "helper never opened the browser" }

          # Stop only the web server (php -S ...); the helper must then exit
          # on its own within 3 ticks.
          $server = Get-CimInstance Win32_Process -Filter "Name='php.exe'" |
            Where-Object { $_.CommandLine -match '-S 127\.0\.0\.1' }
          if (-not $server) { throw "server process not found" }
          $server | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }

          $helperGone = $false
          for ($i = 0; $i -lt 30 -and -not $helperGone; $i++) {
            Start-Sleep -Seconds 1
            $helper = Get-CimInstance Win32_Process -Filter "Name='php.exe'" |
              Where-Object { $_.CommandLine -match 'desktop-helper\.php' }
            if (-not $helper) { $helperGone = $true }
          }
          if (-not $helperGone) { throw "helper did not shut itself down after server stop" }

  publish:
    needs: [build, windows-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # When the tag doesn't exist yet (the workflow_call path), GitHub
          # creates it while publishing — and without an explicit target it
          # points the tag at the default branch's head, not the commit that
          # was built. Pin it to the built commit. Ignored when the tag
          # already exists (the tag-push path).
          target_commitish: ${{ github.sha }}
          name: "CashuPayServer ${{ env.TAG }}"
          body: |
            CashuPayServer ${{ env.TAG }}, built from ${{ github.sha }}.

            Assets:
            - `cashupayserver-${{ env.TAG }}.zip` — standalone server (the auto-updater pulls this)
            - `cashupayserver-windows-${{ env.TAG }}.zip` — Windows desktop package (portable point-of-sale; see README.txt inside)
            - `wordpress_plugin-${{ env.TAG }}.zip` — WordPress plugin
            - `BUILD_INFO` — build metadata
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.make_latest }}
          files: |
            build/cashupayserver-${{ env.TAG }}.zip
            build/wordpress_plugin-${{ env.TAG }}.zip
            build/cashupayserver-windows-${{ env.TAG }}.zip
            build/cashupayserver/BUILD_INFO
