name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-and-ui:
    name: E2E + UI
    runs-on: ubuntu-22.04
    # The full e2e+ui+wordpress suite runs serially (session-scoped bitcoind/
    # lnd/mint/channels rule out xdist) and keeps growing: ~59m of pytest by
    # 2026-08, plus a few minutes of setup — more when a binaries.py change
    # rotates the bins cache and the pinned downloads run cold. 60m was
    # cancelling completed-except-for-the-last-tests runs at ~97%. 75m buys
    # headroom again; sharding remains the real fix once this ceiling is hit.
    timeout-minutes: 75
    # Depend on the artifact build so the WordPress E2E tier can exercise the
    # EXACT zips CI publishes: the GPL plugin zip, and the standalone server
    # zip its "install BareBits alongside" flow downloads and unpacks.
    needs: build-artifacts

    steps:
      - name: Use HTTPS for SSH-form submodule URLs
        # The cashu-wallet-php submodule is checked in with a git@github.com URL;
        # CI runners only have HTTPS credentials, so rewrite SSH -> HTTPS before
        # actions/checkout pulls submodules.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache binary downloads (bitcoind, lnd, static PHP)
        uses: actions/cache@v4
        with:
          path: |
            tests/bin
          key: bins-${{ runner.os }}-${{ hashFiles('tests/fixtures/binaries.py') }}
          restore-keys: |
            bins-${{ runner.os }}-

      # Both venv cache keys must carry the FULL Python version
      # (steps.setup-python.outputs.python-version), not just "3.11": a venv
      # symlinks bin/python3 to the exact hostedtoolcache interpreter that
      # created it, so when a runner image update bumps the 3.11 patch release,
      # a venv cached under a patchless key restores with a dangling symlink
      # and every pip/playwright/mint invocation dies with "bad interpreter".
      - name: Cache nutshell venv
        uses: actions/cache@v4
        with:
          path: tests/.venv-nutshell
          key: nutshell-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('tests/fixtures/nutshell.py') }}

      - name: Cache test runner venv
        uses: actions/cache@v4
        with:
          path: tests/.venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('tests/requirements.txt') }}

      - name: Install Playwright system dependencies
        # `playwright install-deps chromium` needs root to apt-install the libs
        # Chromium needs. The browser tarball itself is cached under tests/bin/.
        # A restored venv whose interpreter no longer exists is rebuilt from
        # scratch rather than reused (belt and suspenders on top of the cache
        # key fix above).
        run: |
          if ! tests/.venv/bin/python3 --version >/dev/null 2>&1; then
            rm -rf tests/.venv
          fi
          python3 -m venv tests/.venv
          source tests/.venv/bin/activate
          pip install --quiet -r tests/requirements.txt
          sudo $(which playwright) install-deps chromium

      - name: Download built artifacts (for the plugin-install E2E)
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Run test suite
        run: |
          ./tests/scripts/run-tests.sh -v
        env:
          PYTHONUNBUFFERED: "1"
          # The WP tests consume these exact artifacts instead of rebuilding
          # them (the E2E job has no Node/composer). If unset, the fixtures
          # build them locally — the path a dev run takes.
          CASHUPAY_WP_PLUGIN_ZIP: ${{ github.workspace }}/build/barebits_wordpress_plugin.zip
          CASHUPAY_STANDALONE_ZIP: ${{ github.workspace }}/build/barebits.zip

      - name: Upload test logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/.tmp/**/*.log
            tests/.tmp/**/*.sqlite
          retention-days: 7
          if-no-files-found: ignore
          # tests/.tmp is a dot-directory; without this the globs silently
          # match nothing ("No files were found") and failures ship no logs.
          include-hidden-files: true

  build-artifacts:
    name: Build artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Use HTTPS for SSH-form submodule URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json, gmp, mbstring, sqlite3, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Both artifacts are built on every push/PR, not just on the release
      # branches, because a broken build is otherwise only discovered when a
      # release is cut.
      - name: Build WordPress plugin
        run: ./scripts/build-wordpress-plugin.sh

      - name: Verify WordPress plugin layout
        # Fails if any literal __DIR__- or CASHUPAY_PLUGIN_DIR-relative require
        # in the built tree does not resolve, or if an expected file is missing
        # from the plugin root. Also asserts no BareBits server code leaks
        # into the GPL-only plugin zip.
        run: |
          php scripts/verify-plugin-build.php build/cashupay \
            cashupay.php \
            uninstall.php \
            state.php \
            installer.php \
            onboarding.php \
            admin-menu.php \
            cron-integration.php \
            btcpay-integration.php \
            elex-discount.php \
            gateway-guard.php \
            readme.txt \
            license.txt \
            assets/img/barebits-gateway-logo.png
          for leaked in includes vendor setup.php admin.php api.php cron.php payment.php; do
            if [ -e "build/cashupay/$leaked" ]; then
              echo "BareBits server code leaked into the GPL plugin build: $leaked" >&2
              exit 1
            fi
          done

      - name: Build standalone zip
        env:
          COMMIT_SHA: ${{ github.sha }}
          CHANNEL: ci
        run: ./scripts/build-standalone.sh

      - name: Verify standalone layout
        # Every entry point router.php dispatches to must be present, or a
        # from-zip install fatals on that route. update.php (the auto-updater),
        # health.php, pay.php and product-image.php were all missing until this
        # check was added.
        run: |
          php scripts/verify-plugin-build.php build/barebits \
            setup.php \
            admin.php \
            api.php \
            router.php \
            index.php \
            health.php \
            pay.php \
            product-image.php \
            update.php \
            provision.php \
            sso.php \
            recover.php \
            includes/database.php \
            LICENSE.md \
            USE_POLICY.md

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/barebits_wordpress_plugin.zip
            build/barebits.zip
          retention-days: 7
          if-no-files-found: error
