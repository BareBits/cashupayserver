name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-and-ui:
    name: E2E + UI
    runs-on: ubuntu-22.04
    # The full e2e+ui+wordpress suite runs serially (session-scoped bitcoind/
    # lnd/mint/channels rule out xdist), taking ~40m and growing. 40m left no
    # headroom — runs were cancelled mid-suite at ~96%. 60m gives room until
    # sharding becomes worthwhile.
    timeout-minutes: 60
    # Depend on the artifact build so the WordPress install E2E can exercise the
    # EXACT zip CI publishes (composer vendor/, flattened plugin layout) rather
    # than the symlink tree the other WP tests assemble from live source.
    needs: build-artifacts

    steps:
      - name: Use HTTPS for SSH-form submodule URLs
        # The cashu-wallet-php submodule is checked in with a git@github.com URL;
        # CI runners only have HTTPS credentials, so rewrite SSH -> HTTPS before
        # actions/checkout pulls submodules.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache binary downloads (bitcoind, lnd, static PHP)
        uses: actions/cache@v4
        with:
          path: |
            tests/bin
          key: bins-${{ runner.os }}-${{ hashFiles('tests/fixtures/binaries.py') }}
          restore-keys: |
            bins-${{ runner.os }}-

      - name: Cache nutshell venv
        uses: actions/cache@v4
        with:
          path: tests/.venv-nutshell
          key: nutshell-${{ runner.os }}-${{ hashFiles('tests/fixtures/nutshell.py') }}

      - name: Cache test runner venv
        uses: actions/cache@v4
        with:
          path: tests/.venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('tests/requirements.txt') }}

      - name: Install Playwright system dependencies
        # `playwright install-deps chromium` needs root to apt-install the libs
        # Chromium needs. The browser tarball itself is cached under tests/bin/.
        run: |
          python3 -m venv tests/.venv || true
          source tests/.venv/bin/activate
          pip install --quiet -r tests/requirements.txt
          sudo $(which playwright) install-deps chromium

      - name: Download built artifacts (for the plugin-install E2E)
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Run test suite
        run: |
          ./tests/scripts/run-tests.sh -v
        env:
          PYTHONUNBUFFERED: "1"
          # test_wp_plugin_zip_install consumes this exact artifact instead of
          # rebuilding the zip (the E2E job has no Node/composer). If unset, the
          # test builds the zip itself — the path a local dev run takes.
          CASHUPAY_WP_PLUGIN_ZIP: ${{ github.workspace }}/build/wordpress_plugin.zip

      - name: Upload test logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/.tmp/**/*.log
            tests/.tmp/**/*.sqlite
          retention-days: 7
          if-no-files-found: ignore

  build-artifacts:
    name: Build artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Use HTTPS for SSH-form submodule URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json, gmp, mbstring, sqlite3, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Both artifacts are built on every push/PR, not just on the release
      # branches, because a broken build is otherwise only discovered when a
      # release is cut. The WordPress zip in particular shipped for a while
      # with wordpress/*.php in a subdirectory, which broke every
      # `__DIR__ . '/sibling.php'` require in the plugin entry point — the zip
      # could not activate at all, and no job ever built it to notice.
      - name: Build WordPress plugin
        run: ./scripts/build-wordpress-plugin.sh

      - name: Verify WordPress plugin layout
        # Fails if any literal __DIR__- or CASHUPAY_PLUGIN_DIR-relative require
        # in the built tree does not resolve, or if an expected file is missing
        # from the plugin root.
        run: |
          php scripts/verify-plugin-build.php build/cashupay \
            cashupay.php \
            uninstall.php \
            bootstrap.php \
            rewrite-rules.php \
            admin-menu.php \
            cron-integration.php \
            activation.php \
            btcpay-integration.php \
            setup.php \
            admin.php \
            api.php \
            pay.php \
            includes/database.php \
            assets/img/barebits-gateway-logo.png

      - name: Build standalone zip
        env:
          COMMIT_SHA: ${{ github.sha }}
          CHANNEL: ci
        run: ./scripts/build-standalone.sh

      - name: Verify standalone layout
        # Every entry point router.php dispatches to must be present, or a
        # from-zip install fatals on that route. update.php (the auto-updater),
        # health.php, pay.php and product-image.php were all missing until this
        # check was added.
        run: |
          php scripts/verify-plugin-build.php build/cashupayserver \
            setup.php \
            admin.php \
            api.php \
            router.php \
            index.php \
            health.php \
            pay.php \
            product-image.php \
            update.php \
            recover.php \
            includes/database.php

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/wordpress_plugin.zip
            build/cashupayserver.zip
          retention-days: 7
          if-no-files-found: error
