# TEMPORARY diagnostic workflow — investigating why the WordPress Playwright
# tests fail on CI (page.goto timeouts) while passing locally and while the
# requests-driven WP tests pass on the same runs. Runs ONLY the wordpress
# browser tests for a fast signal, and ships the fixture server logs either
# way. Remove once the root cause is fixed.
name: WP browser probe

on:
  workflow_dispatch:
  push:
    branches: ["fix/wp-wizard-wiring-timeout"]

jobs:
  wp-browser:
    name: WP browser tests only
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Use HTTPS for SSH-form submodule URLs
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache binary downloads (bitcoind, lnd, static PHP)
        uses: actions/cache@v4
        with:
          path: |
            tests/bin
          key: bins-${{ runner.os }}-${{ hashFiles('tests/fixtures/binaries.py') }}
          restore-keys: |
            bins-${{ runner.os }}-

      - name: Cache test runner venv
        uses: actions/cache@v4
        with:
          path: tests/.venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('tests/requirements.txt') }}

      - name: Install Playwright system dependencies
        run: |
          if ! tests/.venv/bin/python3 --version >/dev/null 2>&1; then
            rm -rf tests/.venv
          fi
          python3 -m venv tests/.venv
          source tests/.venv/bin/activate
          pip install --quiet -r tests/requirements.txt
          sudo $(which playwright) install-deps chromium

      - name: Run WordPress browser tests
        run: |
          ./tests/scripts/run-tests.sh -v \
            wordpress/test_wp_onboarding_choose_validation.py \
            wordpress/test_wp_onboarding_browser_journey.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-probe-logs
          path: |
            tests/.tmp/**/*.log
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
