# Canonical nginx server block for a BareBits (CashuPayServer) install.
#
# This is the tested reference config: the e2e suite's nginx backend renders
# its per-instance copy from this exact file (tests/fixtures/webserver.py
# substitutes the three "# TEST-SUBST:" anchored lines and refuses to run if
# an anchor disappears), so what ships here is what the tests exercise.
#
# Rule-by-rule parity with the Apache .htaccess:
#   deny blocks            <-> .htaccess FilesMatch/[F,L] blocks + router.php blocklist
#   /api-keys/authorize    <-> .htaccess RewriteRule ^api-keys/authorize$
#   /api/v1 and /v1        <-> .htaccess API rewrites to api.php
#   @router front controller <-> .htaccess catch-all RewriteRule ^(.*)$ router.php/$1
#   add_header block       <-> .htaccess mod_headers block
#
# With the @router front controller in place the setup wizard's URL-mode probe
# detects "clean" URLs, same as Apache with mod_rewrite. If you strip it, the
# app degrades gracefully to direct/router-style URLs — but keep the deny
# rules: nginx never reads .htaccess, so without them the data/ directory
# (SQLite database, ecash tokens) is served as plain files.
#
# PHP socket: adjust fastcgi_pass to your php-fpm pool (TCP or unix socket).

server {
    listen 80;  # TEST-SUBST: listen
    server_name _;

    root /var/www/html;  # TEST-SUBST: root
    index index.php;

    # --- security headers (parity with the .htaccess mod_headers block) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- deny rules -------------------------------------------------------
    # Sensitive directories: data/ holds the SQLite DB with ecash tokens
    # (Critical: loss of funds), the rest are code/config that must never be
    # web-accessible.
    location ~ ^/(data|includes|cashu-wallet-php|mint-discovery|btcpayserver-api-docs|scripts|docker|docs|\.claude)(/|$) {
        deny all;
    }
    # Dotfiles (.htaccess, .git, .updater_disabled, ...)
    location ~ /\. {
        deny all;
    }
    # Database files anywhere, including WAL/SHM/journal sidecars
    location ~* \.(sqlite|db)(-(wal|shm|journal))?$ {
        deny all;
    }
    # Operator config that holds secrets (SMTP password, keys)
    location ~ ^/(user_config|config\.local)\.php$ {
        deny all;
    }

    # --- API routing (parity with the .htaccess rewrites) -----------------
    location = /api-keys/authorize {
        rewrite ^ /api-keys/authorize.php last;
    }
    location ^~ /api/v1/ {
        rewrite ^(.*)$ /api.php$1 last;
    }
    # BTCPay compatibility alias
    location ^~ /v1/ {
        rewrite ^(.*)$ /api.php$1 last;
    }

    # --- clean-URL front controller ---------------------------------------
    # Anything that is not a real file or directory goes through router.php,
    # which dispatches the extension-less paths (/admin, /setup, /pay/{store},
    # /payment/{id}, /health, ...). Real files (assets, the .php entry points)
    # are served directly and never loop through the rewrite.
    location / {
        try_files $uri $uri/ @router;
    }
    location @router {
        rewrite ^(.*)$ /router.php$1 last;
    }

    # --- PHP execution with PATH_INFO -------------------------------------
    # PATH_INFO must survive (api.php/api/v1/..., router.php/admin, ...);
    # fastcgi_split_path_info recovers it, and the $cashupay_path_info dance
    # keeps it across the try_files re-evaluation.
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $cashupay_path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        # Debian's fastcgi_params overrides HTTP_HOST with $host, which drops
        # the request's port. On any non-80 deployment (a docker -p mapping,
        # a dev port) the app would then build absolute URLs without the port
        # and redirect loops follow. Restore the client's untouched header.
        fastcgi_param HTTP_HOST $http_host if_not_empty;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $cashupay_path_info;
        fastcgi_pass unix:/run/php/php-fpm.sock;  # TEST-SUBST: fastcgi_pass
    }
}
