# Main nginx config for the test image: everything mutable lives under /tmp
# (a tmpfs writable by the arbitrary --user uid), logs go to the container's
# stdio so `docker logs` (streamed into the instance's wp-server.log /
# php-server.log by the fixture) carries request lines like php -S did.
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
worker_processes 2;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    sendfile on;

    # The per-instance server block, rendered from docker/nginx-site.conf and
    # mounted by tests/fixtures/webserver.py.
    include /etc/nginx/test-sites/*.conf;
}
